<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#163d35" />
    <meta name="description" content="Talenta — ujian rekrutmen sekali pakai dan analisis hasil untuk tim penguji." />
    <title>Talenta · Asesmen Rekrutmen</title>
    <script id="launch-guard">
      if (window.location.protocol === 'file:') {
        window.location.replace('http://localhost:3000/');
      } else {
        window.setTimeout(() => {
          const loading = document.querySelector('.boot');
          if (loading) loading.textContent = 'Halaman belum termuat. Pastikan server npm start tetap berjalan, lalu buka alamat web yang tercetak di terminal dan muat ulang halaman.';
        }, 12000);
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body><noscript>Aktifkan JavaScript di browser untuk menggunakan Talenta.</noscript><div id="app"><div class="boot">Menyiapkan Talenta…</div></div><div id="toast" role="status" aria-live="polite"></div><div id="modal-root"></div></body>
</html>
